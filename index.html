<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Valentine ❤️</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    text-align:center;
    color:white;
    background: linear-gradient(135deg,#ff4e50,#ff758c,#ffb199);
    overflow:hidden;
}

.page{
    display:none;
    height:100vh;
    padding:40px;
}

.active{
    display:block;
}

h1{
    margin-top:50px;
}

p{
    font-size:18px;
    max-width:600px;
    margin:auto;
    line-height:1.6;
}

button{
    padding:12px 25px;
    margin:20px;
    font-size:16px;
    border:none;
    border-radius:25px;
    background:white;
    color:#ff4e50;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

.gift{
    width:130px;
    cursor:pointer;
    margin:20px;
    transition:0.4s;
}

.gift:hover{
    transform:scale(1.2);
}

#finalImage{
    max-width:280px;
    margin-top:30px;
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio autoplay loop>
  <source src="senorita.mp3" type="audio/mpeg">
</audio>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <h1>For You ❤️</h1>
    <p>
        From the day you came into my life, everything feels more beautiful.
        Your smile makes my day brighter,
        your presence makes my heart calmer.
        I don't just like you…
        I feel lucky to have you. 💕
    </p>
    <button onclick="nextPage(2)">Next ➜</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <h1>Will You Be My Valentine? 💖</h1>
    <button onclick="nextPage(3)">Yes ❤️</button>
    <button onclick="alert('No option not allowed 😜❤️')">No 💔</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <h1>Choose Your Gift 🎁</h1>
    <img src="giftbox1.png" class="gift" onclick="showGift('teddy')">
    <img src="giftbox2.png" class="gift" onclick="showGift('flowers')">
</div>

<!-- PAGE 4 (FINAL PAGE - Dynamic Content) -->
<div class="page" id="page4">
    <h1 id="giftTitle"></h1>
    <img id="finalImage">
    <p id="giftText"></p>
</div>

<script>
function nextPage(pageNumber){
    let pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.remove('active'));
    document.getElementById('page'+pageNumber).classList.add('active');
}

function showGift(type){
    nextPage(4);

    if(type === 'teddy'){
        document.getElementById('giftTitle').innerText = "A Cute Teddy For Us 🧸❤️";
        document.getElementById('finalImage').src = "teddy.jpg";
        document.getElementById('giftText').innerText =
        "Just like this teddy, I promise to always stay by your side and hug you with love forever. 💞";
    }
    else{
        document.getElementById('giftTitle').innerText = "A Beautiful Bouquet For You 💐❤️";
        document.getElementById('finalImage').src = "flowers.jpg";
        document.getElementById('giftText').innerText =
        "These flowers are beautiful, but not as beautiful as your smile. You are my forever Valentine. 🌹";
    }
}
</script>

</body>
</html>
